query ProductGet($id: ID!) {
  product(id: $id) {
    id
    title
    handle
    descriptionHtml
    status
    vendor
    productType
    tags
    createdAt
    updatedAt
    totalInventory
    onlineStoreUrl
    variants(first: 25) {
      nodes {
        id
        title
        sku
        price
        inventoryQuantity
      }
    }
    metafields(first: 25) {
      nodes { id namespace key type value }
    }
  }
}
