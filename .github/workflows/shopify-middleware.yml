name: Shopify MCP Middleware

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work
    paths:
      - '.github/workflows/shopify-middleware.yml'
      - '.htaccess'
      - 'config/**'
      - 'mcp-server/**'
      - 'public/**'
      - 'scripts/**'
      - 'src/**'
      - 'DEPLOYMENT.md'
      - 'README.md'

jobs:
  validate-package:
    name: Validate Shopify middleware and build deployment artifact
    runs-on: ubuntu-latest
    env:
      SHOPIFY_SHOP: ${{ secrets.SHOPIFY_SHOP || 'codex-mcp-2.myshopify.com' }}
      SHOPIFY_ADMIN_API_VERSION: ${{ secrets.SHOPIFY_ADMIN_API_VERSION || '2025-10' }}
      MCP_MIDDLEWARE_BASE_URL: https://thedigitalimpressions.com/downloads/mcp
      MCP_HTTP_TIMEOUT_MS: '15000'
      SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
      MCP_SHARED_SECRET: ${{ secrets.MCP_SHARED_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: curl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify required GitHub Actions secrets are present
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          if [[ -z "${SHOPIFY_ADMIN_ACCESS_TOKEN}" ]]; then
            echo "SHOPIFY_ADMIN_ACCESS_TOKEN GitHub Actions secret is missing."
            missing=1
          fi
          if [[ -z "${MCP_SHARED_SECRET}" ]]; then
            echo "MCP_SHARED_SECRET GitHub Actions secret is missing."
            missing=1
          fi
          exit "${missing}"

      - name: Validate PHP syntax
        run: ./scripts/validate-php.sh

      - name: Install MCP bridge dependencies
        run: npm install
        working-directory: mcp-server

      - name: Run MCP bridge smoke test
        run: npm --prefix mcp-server run smoke

      - name: Verify Shopify Admin API connection
        shell: bash
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          request_file="$(mktemp)"
          trap 'rm -f "${response_file}" "${request_file}"' EXIT

          shop_domain="${SHOPIFY_SHOP#https://}"
          shop_domain="${shop_domain#http://}"
          shop_domain="${shop_domain%%/*}"
          shop_domain="${shop_domain%/}"
          api_version="${SHOPIFY_ADMIN_API_VERSION//[[:space:]]/}"
          api_version="${api_version#/}"
          api_version="${api_version%/}"
          shopify_graphql_url="https://${shop_domain}/admin/api/${api_version}/graphql.json"

          python3 - <<'PY' > "${request_file}"
          import json
          print(json.dumps({
              "query": "query ShopifyConnectionCheck { shop { name myshopifyDomain } }",
          }, separators=(",", ":")))
          PY

          echo "Shopify Admin GraphQL URL: ${shopify_graphql_url}"
          echo "Shopify Admin GraphQL payload:"
          cat "${request_file}"
          printf '\n'
          echo "Shopify Admin GraphQL curl command: curl --silent --show-error --output \"${response_file}\" --write-out '%{http_code}' --request POST --url \"${shopify_graphql_url}\" --header 'Content-Type: application/json' --header 'X-Shopify-Access-Token: ***' --data @${request_file}"

          status=$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request POST \
            --url "${shopify_graphql_url}" \
            --header 'Content-Type: application/json' \
            --header "X-Shopify-Access-Token: ${SHOPIFY_ADMIN_ACCESS_TOKEN}" \
            --data "@${request_file}")

          if [[ "${status}" != "200" ]]; then
            echo "Shopify Admin API check failed with HTTP ${status}."
            python3 - "${response_file}" <<'PY'
          import json, sys
          text = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          try:
              payload = json.loads(text)
              print(json.dumps(payload, indent=2)[:1000])
          except Exception:
              print(text[:1000])
          PY
            exit 1
          fi

          python3 - "${response_file}" <<'PY'
          import json, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          shop = payload.get('data', {}).get('shop')
          if not shop:
              print(json.dumps(payload, indent=2)[:1000])
              raise SystemExit('Shopify Admin API response did not include shop data.')
          print('Shopify Admin API connection verified for ' + shop.get('myshopifyDomain', '[unknown-domain]'))
          PY

      - name: Build deployment package with production config from secrets
        shell: bash
        env:
          INCLUDE_PRODUCTION_CONFIG: '1'
        run: ./scripts/build-deployment-package.sh

      - name: Verify deployment package contains production config
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/shopify-mcp-middleware-deploy.zip | grep -q 'config/app.php'
          unzip -l dist/shopify-mcp-middleware-deploy.zip | grep -q 'public/index.php'
          unzip -l dist/shopify-mcp-middleware-deploy.zip | grep -q 'src/Services/ShopifyAdminClient.php'

      - name: Upload manual deployment package
        uses: actions/upload-artifact@v4
        with:
          name: shopify-mcp-middleware-deploy
          path: dist/shopify-mcp-middleware-deploy.zip
          if-no-files-found: error
          retention-days: 7
